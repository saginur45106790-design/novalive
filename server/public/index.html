<!doctype html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>NovaLive · Admin Control</title><style>
:root{color-scheme:dark;font-family:Inter,system-ui,Arial,sans-serif;background:#0b1020;color:#f2f4fc}*{box-sizing:border-box}body{margin:0}main{max-width:1160px;margin:auto;padding:26px}h1{font-size:26px;margin-bottom:8px}h2{font-size:18px;margin:0 0 16px}small,.muted{color:#a4adc8}input,button,select{font:inherit;border:1px solid #34405f;border-radius:12px;padding:11px;background:#161e34;color:white}input{width:100%;margin:7px 0}button{cursor:pointer;background:#7848eb;border:none;font-weight:600}button.secondary{background:#2d3958}button.danger{background:#902c47}button:disabled{opacity:.45;cursor:wait}.layout{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.card{background:#161e34;border:1px solid #27324c;border-radius:16px;padding:18px;margin-bottom:18px}.number{font-size:30px;font-weight:700}table{width:100%;border-collapse:collapse}th,td{text-align:left;border-bottom:1px solid #2b3452;padding:12px 8px;font-size:13px}td button{padding:8px;margin:2px}.scroller{overflow-x:auto;max-width:100%;-webkit-overflow-scrolling:touch}.scroller table{min-width:640px}table td:first-child{overflow-wrap:anywhere}nav{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}nav button{background:#283352}nav button.active{background:#7848eb}.hidden{display:none}#message{min-height:26px;color:#f9c47c}label{display:block;margin:8px 0}
</style></head><body><main><h1>✦ NovaLive Control Center</h1><p class="muted">Admin access only. All actions are server-validated.</p><div id="message" role="status"></div><section id="login" class="card" style="max-width:420px"><h2>Administrator sign in</h2><form id="loginform"><label>Email<input type="email" id="email" required autocomplete="username"/></label><label>Password<input type="password" id="password" required autocomplete="current-password"/></label><button type="submit">Sign in</button></form></section><section id="app" class="hidden"><div class="layout" id="stats"></div><nav><button data-page="users" class="active">People</button><button data-page="reports">Safety reports</button><button data-page="withdrawals">Withdrawals</button><button id="logout" class="secondary">Log out</button></nav><section class="card"><h2 id="pageTitle"></h2><div id="data" class="scroller"></div></section></section></main><script src="/admin/admin.js" defer></script></body></html>

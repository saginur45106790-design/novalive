name: Initialize Super Admin

on:
  workflow_dispatch:

jobs:
  setup-admin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: server
        run: npm install

      - name: Create database tables and admin
        working-directory: server
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ADMIN_BOOTSTRAP_EMAIL: ${{ secrets.ADMIN_BOOTSTRAP_EMAIL }}
          ADMIN_BOOTSTRAP_PASSWORD: ${{ secrets.ADMIN_BOOTSTRAP_PASSWORD }}
        run: |
          npm run migrate
          npm run admin:create

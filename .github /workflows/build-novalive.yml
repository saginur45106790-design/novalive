name: Build NovaLive V3 Verified Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/build-novalive.yml'

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout NovaLive source
        uses: actions/checkout@v4

      - name: Verify the exact Render API URL before packaging
        shell: bash
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from urllib.parse import urlsplit
          url = os.environ.get('API_BASE_URL','').strip().rstrip('/')
          parts = urlsplit(url)
          if parts.scheme != 'https' or not parts.hostname or parts.username or parts.password or parts.query or parts.fragment or parts.path:
              raise SystemExit('ERROR: Settings > Secrets and variables > Actions > Variables > API_BASE_URL must be exactly the Render HTTPS base URL (no /health or /api).')
          print('Building against:', url)
          PY
          # A sleeping Render Free instance can require extra time to wake.
          curl --fail --show-error --silent --location \
            --retry 3 --retry-delay 12 --retry-all-errors \
            --connect-timeout 15 --max-time 110 \
            "${API_BASE_URL%/}/health" -o /tmp/novalive-health.json
          python3 - <<'PY'
          import json
          with open('/tmp/novalive-health.json', encoding='utf-8') as f:
              data = json.load(f)
          if data.get('ok') is not True:
              raise SystemExit('ERROR: Render /health returned a response without ok:true. Correct API_BASE_URL before building.')
          print('Verified: Render /health returned ok:true')
          PY

      - name: Install Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Save SOURCE Android release manifest
        shell: bash
        run: |
          set -euo pipefail
          test -f mobile/android/app/src/main/AndroidManifest.xml
          cp mobile/android/app/src/main/AndroidManifest.xml /tmp/novalive-source-manifest.xml
          grep -q 'android.permission.INTERNET' /tmp/novalive-source-manifest.xml

      - name: Generate required Android project files
        run: flutter create --platforms=android --org com.novalive mobile

      - name: Restore permissions AFTER flutter create
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/novalive-source-manifest.xml mobile/android/app/src/main/AndroidManifest.xml
          for p in android.permission.INTERNET android.permission.ACCESS_NETWORK_STATE android.permission.CAMERA android.permission.RECORD_AUDIO; do
            grep -q "$p" mobile/android/app/src/main/AndroidManifest.xml || { echo "Missing $p from AndroidManifest.xml"; exit 1; }
          done
          echo 'Source release manifest restored. Final APK permission will be checked later.'

      - name: Resolve Flutter dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Build unique version 3.0.0 APK with validated API URL
        working-directory: mobile
        shell: bash
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          set -euo pipefail
          flutter build apk --release --build-name=3.0.0 --build-number=300 \
            --dart-define="API_BASE_URL=${API_BASE_URL%/}"

      - name: Inspect INTERNET permission inside the COMPILED APK
        shell: bash
        run: |
          set -euo pipefail
          APK=mobile/build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          AAPT=$(find "$SDK/build-tools" -type f -name aapt | sort -V | tail -n 1)
          test -n "$AAPT" || { echo 'ERROR: Android aapt is missing, cannot certify APK permissions'; exit 1; }
          "$AAPT" dump permissions "$APK" | tee /tmp/novalive-apk-permissions.txt
          for p in android.permission.INTERNET android.permission.ACCESS_NETWORK_STATE android.permission.CAMERA android.permission.RECORD_AUDIO; do
            grep -q "$p" /tmp/novalive-apk-permissions.txt || { echo "FAIL: Final APK does not include $p"; exit 1; }
          done
          echo 'PASS: Real compiled APK contains network, camera and microphone permissions.'

      - name: Upload ONLY the verified V3 APK
        uses: actions/upload-artifact@v4
        with:
          name: NovaLive-V3-Verified-Internet-APK
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

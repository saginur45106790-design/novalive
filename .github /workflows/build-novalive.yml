name: Build NovaLive Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/build-novalive.yml'

jobs:
  android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android files
        run: flutter create --platforms=android --org com.novalive mobile

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Build Android APK
        working-directory: mobile
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          if [[ "$API_BASE_URL" != https://* ]]; then
            echo "API_BASE_URL is missing"
            exit 1
          fi
          flutter build apk --release --dart-define="API_BASE_URL=$API_BASE_URL"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NovaLive-Android-APK
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
